[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "URLCheck"
version = "1.0.0"
description = "Check URLs for Google Safe Browsing status and availability, and draft a report email."
authors = [{ name = "Landon Stewart", email = "landonstewart@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hyperlink>=21",
    "iocextract>=1.16",
    "PyFunceble>=4.2",
    "pysafebrowsing>=0.1.3",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.scripts]
urlcheck = "urlcheck.urlcheck:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # ruff format handles length; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
